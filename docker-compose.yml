services:
  db:
    container_name: Mysql-db
    image: mysql:8.4
    restart: always
    env_file: .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - new_network

  web:
    build:
      context: .
    restart: always
    env_file: .env
    command: sh -c "python manage.py makemigrations tasks && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application -b 0.0.0.0:8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new_network

  nginx:
    image: nginx:1.27-alpine
    container_name: Nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - new_network

volumes:
  mysql_data:

networks:
  new_network:
